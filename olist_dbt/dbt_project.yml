name: 'olist_dbt'
version: '1.0.0'
profile: 'olist_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         
  - "target"
  - "dbt_packages"

models:
  olist_dbt:
    staging:
      schema: staging
      +materialized: table
      tags: ['staging']

    intermediate:
      schema: intermediate
      +materialized: ephemeral
      tags: ['intermediate']

    marts:
      schema: marts
      +materialized: table
      tags: ['marts']

seeds:
  olist_dbt:
    schema: seeds
