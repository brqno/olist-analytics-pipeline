
version: 2

models:
  - name: stg_category_translation
    description: "Padroniza os nomes de categorias nos idiomas disponíveis"
    columns:
      - name: product_category_name
        description: "Nome da categoria em português"
        data_tests:
          - not_null
          - unique
      - name: product_category_name_english
        description: "Nome da categoria em inglês"

  - name: stg_customers
    description: "Padroniza os dados de clientes"
    columns:
      - name: customer_id
        description: "Identificador do registro do cliente"
        data_tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: "Identificador único do cliente"

  - name: stg_geolocation
    description: "Padroniza os dados de geolocalização"
    columns:
      - name: geolocation_zip_code_prefix
        description: "Prefixo do código postal"
      - name: geolocation_latitude
        description: "Latitude da geolocalização"
      - name: geolocation_longitude
        description: "Longitude da geolocalização"

  - name: stg_order_items
    description: "Padroniza os itens associados aos pedidos"
    columns:
      - name: order_id
        description: "Identificador do pedido"
        data_tests:
          - not_null
      - name: order_item_id
        description: "Número sequencial do item no pedido"
        data_tests:
          - not_null
      - name: shipping_limit_date
        description: "Data e hora limite para envio"

  - name: stg_order_payments
    description: "Padroniza os pagamentos associados aos pedidos"
    columns:
      - name: order_id
        description: "Identificador do pedido"
        data_tests:
          - not_null
      - name: payment_sequential
        description: "Número sequencial do pagamento"
        data_tests:
          - not_null
      - name: payment_value
        description: "Valor do pagamento"

  - name: stg_order_reviews
    description: "Padroniza as avaliações dos pedidos"
    columns:
      - name: review_id
        description: "Identificador de avaliação fornecido pela origem; pode se repetir entre pedidos"
        data_tests:
          - not_null
      - name: order_id
        description: "Identificador do pedido"
      - name: review_score
        description: "Nota da avaliação"

  - name: stg_orders
    description: "Padroniza os dados dos pedidos"
    columns:
      - name: order_id
        description: "Identificador do pedido"
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "Identificador do cliente"
      - name: order_delivered_customer_date
        description: "Data e hora de entrega ao cliente"

  - name: stg_products
    description: "Padroniza os dados dos produtos"
    columns:
      - name: product_id
        description: "Identificador do produto"
        data_tests:
          - not_null
          - unique
      - name: product_category_name
        description: "Nome da categoria do produto"
      - name: product_name_length
        description: "Comprimento do nome do produto"
      - name: product_description_length
        description: "Comprimento da descrição do produto"

  - name: stg_sellers
    description: "Padroniza os dados dos vendedores"
    columns:
      - name: seller_id
        description: "Identificador do vendedor"
        data_tests:
          - not_null
          - unique
      - name: seller_zip_code_prefix
        description: "Prefixo do código postal do vendedor"
