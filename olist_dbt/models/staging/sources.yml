version: 2

sources:
  - name: olist
    description: "Dados brutos do banco de dados Olist"
    database: "olist_project"
    schema: "bronze"
    tables:

      - name: raw_category_translation
        description: "Categorias de produtos em português e inglês"
        columns:
          - name: product_category_name
            description: "Nome da categoria em português"
            data_tests: [not_null]
          - name: product_category_name_english
            description: "Nome da categoria em inglês"
            data_tests: [not_null]

      - name: raw_customers
        description: "Dados dos clientes"
        columns:
          - name: customer_id
            description: "Identificador do registro do cliente"
            data_tests:
              - unique
              - not_null
          - name: customer_unique_id
            description: "Identificador da pessoa, compartilhado por registros de clientes relacionados"
            data_tests:
              - not_null
          - name: customer_zip_code_prefix
            description: "Prefixo do código postal do cliente"
          - name: customer_city
            description: "Cidade do cliente"
          - name: customer_state
            description: "Estado do cliente"

      - name: raw_geolocation
        description: "Dados de geolocalização por prefixo de código postal"
        columns:
          - name: geolocation_zip_code_prefix
            description: "Prefixo do código postal"
          - name: geolocation_lat
            description: "Latitude da geolocalização"
          - name: geolocation_lng
            description: "Longitude da geolocalização"
          - name: geolocation_city
            description: "Cidade da geolocalização"
          - name: geolocation_state
            description: "Estado da geolocalização"

      - name: raw_order_items
        description: "Itens associados aos pedidos, produtos e vendedores"
        columns:
          - name: order_id
            description: "Identificador do pedido"
            data_tests:
              - not_null
          - name: order_item_id
            description: "Número sequencial do item no pedido"
            data_tests:
              - not_null
          - name: product_id
            description: "Identificador do produto"
            data_tests:
              - not_null
          - name: seller_id
            description: "Identificador do vendedor"
            data_tests:
              - not_null
          - name: shipping_limit_date
            description: "Data limite para envio"
          - name: price
            description: "Preço do item"
            data_tests:
              - not_null
          - name: freight_value
            description: "Valor do frete"
            data_tests:
              - not_null

      - name: raw_order_payments
        description: "Pagamentos associados aos pedidos"
        columns:
          - name: order_id
            description: "Identificador do pedido"
          - name: payment_sequential
            description: "Número sequencial do pagamento"
          - name: payment_type
            description: "Tipo de pagamento"
          - name: payment_installments
            description: "Número de parcelas"
          - name: payment_value
            description: "Valor do pagamento"

      - name: raw_order_reviews
        description: "Avaliações dos pedidos"
        columns:
          - name: review_id
            description: "Identificador da avaliação"
          - name: order_id
            description: "Identificador do pedido"
          - name: review_score
            description: "Nota da avaliação"
          - name: review_comment_title
            description: "Título do comentário"
          - name: review_comment_message
            description: "Mensagem do comentário"
          - name: review_creation_date
            description: "Data de criação da avaliação"
          - name: review_answer_timestamp
            description: "Data e hora da resposta à avaliação"

      - name: raw_orders
        description: "Dados dos pedidos"
        columns:
          - name: order_id
            description: "Identificador do pedido"
          - name: customer_id
            description: "Identificador do cliente"
          - name: order_status
            description: "Status do pedido"
          - name: order_purchase_timestamp
            description: "Data e hora da compra"
          - name: order_approved_at
            description: "Data e hora da aprovação"
          - name: order_delivered_carrier_date
            description: "Data de entrega ao transportador"
          - name: order_delivered_customer_date
            description: "Data de entrega ao cliente"
          - name: order_estimated_delivery_date
            description: "Data estimada de entrega"

      - name: raw_products
        description: "Dados dos produtos"
        columns:
          - name: product_id
            description: "Identificador do produto"
          - name: product_category_name
            description: "Nome da categoria do produto"
          - name: product_name_lenght
            description: "Comprimento do nome do produto"
          - name: product_description_lenght
            description: "Comprimento da descrição do produto"
          - name: product_photos_qty
            description: "Quantidade de fotos do produto"
          - name: product_weight_g
            description: "Peso do produto em gramas"
          - name: product_length_cm
            description: "Comprimento do produto em centímetros"
          - name: product_height_cm
            description: "Altura do produto em centímetros"
          - name: product_width_cm
            description: "Largura do produto em centímetros"

      - name: raw_sellers
        description: "Dados dos vendedores"
        columns:
          - name: seller_id
            description: "Identificador do vendedor"
          - name: seller_zip_code_prefix
            description: "Prefixo do código postal do vendedor"
          - name: seller_city
            description: "Cidade do vendedor"
          - name: seller_state
            description: "Estado do vendedor"
